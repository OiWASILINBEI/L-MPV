name: "自动发布 L-MPV"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: 检出源代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 npm 依赖
        run: npm ci

      - name: 下载并解压外部组件 (libmpv-2.dll, ffmpeg.exe, mediainfo.dll)
        shell: pwsh
        run: |
          Write-Host "正在从 deps-v1 发布页下载依赖组件..."
          Invoke-WebRequest -Uri "https://github.com/Menely/L-MPV/releases/download/deps-v1/mpv_libs.zip" -OutFile "mpv_libs.zip"
          Write-Host "正在解压到 src-tauri/binaries/ ..."
          Expand-Archive -Path mpv_libs.zip -DestinationPath src-tauri/binaries/ -Force
          Remove-Item mpv_libs.zip -Force

          # 检查全部三个原生组件是否存在且完整
          $binFiles = @("src-tauri/binaries/libmpv-2.dll", "src-tauri/binaries/ffmpeg.exe", "src-tauri/binaries/mediainfo.dll")
          foreach ($f in $binFiles) {
            if (-not (Test-Path $f)) { throw "严重错误: src-tauri/binaries 目录缺少原生依赖文件: $f" }
            if ((Get-Item $f).Length -eq 0) { throw "严重错误: 文件 $f 是空文件!" }
          }
          Write-Host "所有原生依赖检查通过 (libmpv-2.dll 含 vf_animejanai, ffmpeg.exe, mediainfo.dll)。"

      - name: 从 Git 标签同步版本号到 package.json 和 Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          if ($ver -match '^\d+\.\d+\.\d+') {
            Write-Host "正在从标签 $tag 设置版本号 $ver ..."
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $pkg.version = $ver
            $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

            (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*?"', "version = `"$ver`"" | Set-Content src-tauri/Cargo.toml
          }

      - name: 编译并发布 Tauri 版本
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'L-MPV v__VERSION__'
          releaseBody: 'L-MPV 媒体播放器简体中文汉化版（详见下方中文更新日志）。'
          releaseDraft: false
          prerelease: false

      - name: 发布便携版压缩包、独立 l-mpv.exe 和完整性清单
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -notmatch '^v\d+') {
            $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          Write-Host "正在准备完整的便携版发行包..."
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/models/onnx" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/inference" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/config/presets" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/screenshots" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/fonts" | Out-Null
          Copy-Item "src/assets/fonts/*" -Destination "Portable-L-MPV/fonts/" -Force
          
          Copy-Item "src-tauri/target/release/l-mpv.exe" -Destination "Portable-L-MPV/l-mpv.exe" -Force
          Copy-Item "src-tauri/binaries/libmpv-2.dll" -Destination "Portable-L-MPV/libmpv-2.dll" -Force
          Copy-Item "src-tauri/binaries/ffmpeg.exe" -Destination "Portable-L-MPV/ffmpeg.exe" -Force
          Copy-Item "src-tauri/binaries/mediainfo.dll" -Destination "Portable-L-MPV/mediainfo.dll" -Force
          
          Write-Host "正在生成完整性清单 checksums.json..."
          Push-Location src-tauri
          cargo run --release -q --example gen_checksums -- -o ../checksums.json ../Portable-L-MPV
          Pop-Location
          Copy-Item "checksums.json" -Destination "Portable-L-MPV/checksums.json" -Force

          $portableZip = "L-MPV-$tag-portable.zip"
          Write-Host "正在创建压缩包 $portableZip ..."
          Compress-Archive -Path "Portable-L-MPV/*" -DestinationPath $portableZip -Force
          
          Write-Host "正在上传产物到发布页 $tag ..."
          gh release upload $tag $portableZip --clobber
          gh release upload $tag "src-tauri/target/release/l-mpv.exe#l-mpv.exe" --clobber
          gh release upload $tag "checksums.json#checksums.json" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 应用纯中文发布说明
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -notmatch '^v\d+') {
            $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          if (Test-Path ".github/release-notes-zh.md") {
            Write-Host "正在将中文更新日志应用到发布页 $tag ..."
            gh release edit $tag --notes-file .github/release-notes-zh.md
            Write-Host "中文发布说明已更新完成。"
          } else {
            Write-Host "未找到 .github/release-notes-zh.md，跳过发布说明更新。"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

